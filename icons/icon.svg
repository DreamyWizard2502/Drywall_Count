<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1673e6"/>
      <stop offset="1" stop-color="#0a4fa8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stack of drywall sheets -->
  <g stroke="#0a3d82" stroke-width="6" stroke-linejoin="round">
    <rect x="118" y="132" width="250" height="300" rx="10" fill="#c9d3df" transform="rotate(-8 243 282)"/>
    <rect x="128" y="112" width="250" height="300" rx="10" fill="#dfe6ee" transform="rotate(-3 253 262)"/>
    <rect x="140" y="94" width="250" height="300" rx="10" fill="#f6f8fb"/>
  </g>
  <!-- tally marks -->
  <g stroke="#0a4fa8" stroke-width="16" stroke-linecap="round">
    <line x1="190" y1="160" x2="190" y2="268"/>
    <line x1="228" y1="160" x2="228" y2="268"/>
    <line x1="266" y1="160" x2="266" y2="268"/>
    <line x1="304" y1="160" x2="304" y2="268"/>
    <line x1="170" y1="250" x2="326" y2="176"/>
  </g>
  <!-- check badge -->
  <circle cx="360" cy="374" r="78" fill="#12813a" stroke="#ffffff" stroke-width="12"/>
  <path d="M322 376 l26 26 l52 -56" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
